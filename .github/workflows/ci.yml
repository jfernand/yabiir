name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # The optional `tracing` feature (structured logging/spans, see
      # docs/ROADMAP.md §4) changes what compiles — check it separately
      # from the default-features build above, not just once combined.
      - run: cargo clippy --all-targets --features tracing -- -D warnings

  test-tracing-feature:
    name: test (tracing feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features tracing

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No Windows: src/datafile.rs is unix-only by design (pread-based
        # positioned reads — see its module doc), and fails to compile
        # (compile_error!) on any other target family.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc

  proptest-extra:
    name: proptest (extra cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: PROPTEST_CASES=2000 cargo test --test model
