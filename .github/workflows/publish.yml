name: Publish to crates.io

# Triggered by pushing a tag like `v0.2.1` — the version after `v` must
# match yabiir's Cargo.toml `version` exactly, checked below before
# publishing. Tag a release with `cargo xtask release` (see README.md),
# which does exactly that plus the push, or manually:
#   git tag v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="yabiir") | .version')
#   git push origin <the tag just printed>
#
# `.packages[]` is filtered by name, not indexed by position — the
# repo is a workspace (yabiir plus the unpublished `xtask` dev-tooling
# crate), and `cargo metadata`'s package order isn't guaranteed.
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="yabiir") | .version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      # Safety net: the push/PR CI workflow already covers ordinary commits,
      # but a tag push doesn't itself trigger that workflow, so re-run the
      # full suite here before publishing rather than trusting the tag was
      # only ever pushed against an already-green commit.
      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Publish to crates.io
        run: cargo publish -p yabiir --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
