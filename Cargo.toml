[package]
name = "yabiir"
version = "0.1.0"
edition = "2024"
description = "Yet another bitcask implementation in rust"

[dependencies]
crc32fast = "1.5.1"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4"

[lib]

[[bin]]
name = "kv"
path = "src/bin/kv.rs"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "keydir"
harness = false

[[bench]]
name = "datafile"
harness = false

[[bench]]
name = "merge"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Same optimizations as release, plus debug symbols, so `cargo flamegraph`
# (perf-based) can resolve real function names instead of raw addresses.
# Kept separate from [profile.release] so normal release builds stay lean.
[profile.profiling]
inherits = "release"
debug = true