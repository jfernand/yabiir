# Virtual workspace: no package at the root.
#
# - `crates/yabiir`: the storage engine, the one published crate.
# - `crates/yabiir-sql`: a small SQL front end over a store.
# - `crates/yabiir-cli`: `kv`, a command-line front end.
# - `crates/yabiir-loadtest`: `loadtest`, a load generator.
# - `crates/yabiir-examples`: example programs with heavy dependencies.
# - `xtask`: dev tooling (`cargo xtask release`, `cargo xtask bench`).
[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.dependencies]
yabiir = { path = "crates/yabiir", version = "0.8.0" }
yabiir-testutil = { path = "crates/yabiir-testutil" }
clap = { version = "4.6.6", features = ["derive"] }

# Fields shared by every published crate; members opt in with
# `field.workspace = true`.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfernand/yabiir"

# Profiles only take effect in the workspace root manifest.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Same optimizations as release, plus debug symbols, so `cargo flamegraph`
# (perf-based) can resolve real function names instead of raw addresses.
# Kept separate from [profile.release] so normal release builds stay lean.
[profile.profiling]
inherits = "release"
debug = true
