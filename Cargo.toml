[package]
name = "yabiir"
version = "0.2.1-dev"
edition = "2024"
description = "Bitcask implementation in rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfernand/yabiir"
readme = "README.md"
keywords = ["bitcask", "key-value", "storage-engine", "embedded-database"]
categories = ["database-implementations", "filesystem"]
# General Riak-ecosystem background reading, not specific to Bitcask itself
# (unlike docs/papers/bitcask-intro.pdf, which the README links to directly)
# — large and not needed to build or use this crate, so kept out of the
# published package.
exclude = [
    "docs/papers/basho-relational-to-riak-whitepaper.pdf",
    "docs/papers/dynamo-amazon-sosp2007.pdf",
]

[dependencies]
crc32fast = "1.5.1"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4"
ahash = "0.8"

[lib]

[[bin]]
name = "kv"
path = "src/bin/kv.rs"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
ratatui = "0.29"
crossterm = "0.28"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "keydir"
harness = false

[[bench]]
name = "datafile"
harness = false

[[bench]]
name = "merge"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Same optimizations as release, plus debug symbols, so `cargo flamegraph`
# (perf-based) can resolve real function names instead of raw addresses.
# Kept separate from [profile.release] so normal release builds stay lean.
[profile.profiling]
inherits = "release"
debug = true