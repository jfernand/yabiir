[package]
name = "yabiir-examples"
version = "0.1.0"
edition.workspace = true
description = "Larger example programs built on yabiir"
license.workspace = true
repository.workspace = true
publish = false

# The examples that need heavy dependencies (a terminal UI, an async runtime,
# a websocket client) live here, so that the yabiir crate itself builds and
# tests with none of them. Run one with `cargo run --example <name>`.

[dev-dependencies]
yabiir.workspace = true
clap.workspace = true
ratatui = "0.29"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures-util = "0.3.34"
atrium-api = "0.25.8"
rs-car = "0.5.0"
serde_ipld_dagcbor = "0.7.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
