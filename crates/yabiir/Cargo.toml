[package]
name = "yabiir"
version = "0.5.0"
edition.workspace = true
description = "Bitcask implementation in rust"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["bitcask", "key-value", "storage-engine", "embedded-database"]
categories = ["database-implementations", "filesystem"]

[dependencies]
crc32fast = "1.5.1"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4"
ahash = "0.8"
tracing = { version = "0.1.44", optional = true }

[lib]

[[bin]]
name = "kv"
path = "src/bin/kv.rs"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
ratatui = "0.29"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
futures-util = "0.3.34"
atrium-api = "0.25.8"
rs-car = "0.5.0"
serde_ipld_dagcbor = "0.7.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }

[[bench]]
name = "format"
harness = false

[[bench]]
name = "keydir"
harness = false

[[bench]]
name = "datafile"
harness = false

[[bench]]
name = "merge"
harness = false

[features]
tracing = ["dep:tracing"]
