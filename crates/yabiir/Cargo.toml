[package]
name = "yabiir"
version = "0.7.0"
edition.workspace = true
description = "Bitcask implementation in rust"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["bitcask", "key-value", "storage-engine", "embedded-database"]
categories = ["database-implementations", "filesystem"]

[dependencies]
crc32fast = "1.5.1"
fs2 = "0.4"
ahash = "0.8"
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
yabiir-testutil.workspace = true
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "keydir"
harness = false

[[bench]]
name = "keydir_order"
harness = false

[[bench]]
name = "datafile"
harness = false

[[bench]]
name = "merge"
harness = false

[features]
# Send the crate's warnings through `tracing`, and wrap each phase of a merge
# in a span, instead of printing to stderr.
tracing = ["dep:tracing"]
